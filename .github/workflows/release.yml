name: Manual Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching package.json and release/release-<version>.md
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity and notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(version ?? '')) throw new Error('Invalid release version');
          for (const file of ['package.json', 'apps/cli/package.json']) {
            if (JSON.parse(readFileSync(file, 'utf8')).version !== version) throw new Error('Version mismatch');
          }
          const notes = readFileSync(`release/release-${version}.md`, 'utf8');
          if (!notes.includes(version) || notes.includes('未发布草稿') || notes.includes('尚未发布')) throw new Error('Finalize release notes before publishing');
          NODE
  checks:
    needs: validate
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm smoke:package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-package
          path: artifacts/*.tgz
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/release-${{ inputs.version }}.md
          files: artifacts/*.tgz
          fail_on_unmatched_files: true
